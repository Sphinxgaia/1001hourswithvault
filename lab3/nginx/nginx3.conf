# nginx3 (réseau rewrite-net) — namespace admin porté par le CHEMIN, sans
# injection d'en-tête : OpenBao accepte le namespace en préfixe d'API
# (/v1/admin/...). L'en-tête client X-Vault-Namespace est supprimé (valeur
# vide) pour que le chemin fasse seul foi — sinon il composerait un namespace
# relatif (admin/<en-tête>).
#
# L'UI (/ui/) est volontairement NON réécrite et sans en-tête : elle est
# servie dans le namespace racine, alors que tous les appels API /v1/ de la
# même origine partent dans admin. Contraste à observer dans le navigateur.
server {
    listen 80;
    server_name _;

    # Redirections relatives (comme celles d'OpenBao) : sans cela nginx
    # génère http://<host>/ui/ en perdant le port publié.
    absolute_redirect off;

    # Comme sur les autres proxys : / mène à l'UI.
    location = / {
        return 307 /ui/;
    }

    location = /ui {
        return 301 /ui/;
    }

    location /ui/ {
        proxy_pass http://172.28.3.10:8220;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints que l'UI OpenBao interroge toujours dans la racine
    # (NAMESPACE_ROOT_URLS du bundle) : non réécrits, sinon l'UI reste sur
    # le logo (sys/health répond « operation unavailable in namespaces »).
    location ~ ^/v1/(sys/health|sys/seal-status|sys/internal/counters/config)$ {
        proxy_pass http://172.28.3.10:8220;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Vault-Namespace "";
    }

    location /v1/ {
        rewrite ^/v1/(.*)$ /v1/admin/$1 break;
        proxy_pass http://172.28.3.10:8220;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Vault-Namespace "";
    }

    location / {
        return 404;
    }
}
