# nginx1 (réseau root-net) — proxy transparent vers OpenBao.
# Aucun en-tête de namespace n'est ajouté : les requêtes arrivent dans le
# namespace racine.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://172.28.1.10:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
