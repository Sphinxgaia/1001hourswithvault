# nginx2 (réseau admin-net) — proxy vers OpenBao avec namespace forcé.
# Chaque requête part avec l'en-tête X-Vault-Namespace: admin ; proxy_set_header
# remplace tout en-tête du même nom envoyé par le client.
server {
    listen 80;
    server_name _;

    # Endpoints que l'UI OpenBao interroge toujours dans la racine
    # (NAMESPACE_ROOT_URLS du bundle) : pas d'injection d'en-tête, sinon
    # sys/health répond « operation unavailable in namespaces » et l'UI
    # reste bloquée sur le logo.
    location ~ ^/v1/(sys/health|sys/seal-status|sys/internal/counters/config)$ {
        proxy_pass http://172.28.2.10:8210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Vault-Namespace "";
    }

    location / {
        proxy_pass http://172.28.2.10:8210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Vault-Namespace admin;
    }
}
